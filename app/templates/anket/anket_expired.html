<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Anket Süresi Doldu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fafafa;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            border: 1px solid #eee;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fdecea;
            color: #d32f2f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            color: #222;
        }
        .poll-title {
            font-size: 18px;
            font-weight: 600;
            color: #d32f2f;
            margin-bottom: 15px;
        }
        .desc {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #d32f2f;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">
        ⏰
    </div>

    <h1>Anket Kapandı</h1>

    <div class="poll-title">
        {{ poll.title }}
    </div>

    <div class="desc">
        {{message}}
    </div>

    <a href="{% url 'anket:poll_results' poll.id %}" class="back-btn">
        Sonuçları gör
    </a>

    <a href="{% url 'anket:polls' %}" class="back-btn">
        Anketlere Dön
    </a>

</div>
</body>
</html>
