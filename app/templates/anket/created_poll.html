<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Anket Oluşturuldu</title>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h2>Anket Oluşturuldu</h2>
        <div class="poll-title">{{ poll.title }}</div>

        {% if url %}
            <div class="share-box">
                <div class="share-header">
                    <span>Paylaşım Linki</span>
                    <span class="badge">Private</span>
                </div>

                <div class="input-group">
                    <input type="text" value="{{ url }}" id="shareInput" readonly>
                    <button onclick="copyLink()" id="copyBtn">Kopyala</button>
                </div>

                <div class="hint">Bu linki paylaşarak erişim sağlayabilirsiniz</div>
            </div>
        {% else %}
            <div class="public-box">
                Bu anket herkese açık (public)
            </div>
        {% endif %}

        <a href="{% url 'anket:polls' %}" class="back-btn">
            Listeye Dön
        </a>

    </div>
</div>

<script>
function copyLink() {
    const input = document.getElementById("shareInput");
    const btn = document.getElementById("copyBtn");

    navigator.clipboard.writeText(input.value).then(() => {
        btn.innerText = "Kopyalandı";
        btn.classList.add("copied");

        setTimeout(() => {
            btn.innerText = "Kopyala";
            btn.classList.remove("copied");
        }, 1500);
    });
}
</script>

</body>
</html>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
}
.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 40px;
    text-align: center;
    transition: 0.2s;
}
.icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #fdecea;
    color: #d32f2f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
}
h2 {
    margin: 0 0 8px 0;
    font-size: 22px;
}
.poll-title {
    color: #555;
    font-size: 15px;
    margin-bottom: 25px;
}
.share-box {
    text-align: left;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 25px;
    background: #fafafa;
}
.share-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 10px;
    color: #666;
}
.badge {
    background: #fdecea;
    color: #d32f2f;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
}
.input-group {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
}
button {
    background: #d32f2f;
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}
button:hover {
    background: #b71c1c;
}
button.copied {
    background: #388e3c;
}
.hint {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
}
.public-box {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 8px;
    color: #555;
    margin-bottom: 25px;
}
.back-btn {
    display: inline-block;
    text-decoration: none;
    font-size: 14px;
    color: #d32f2f;
    font-weight: 600;
    transition: 0.2s;
}
.back-btn:hover {
    text-decoration: underline;
}
</style>
