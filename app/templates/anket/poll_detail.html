<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ poll.title }}</title>
</head>
<body>

<div class="upper_bar">
    <div class="nav-container">
        <a href="{% url 'anket:polls' %}">Geri Dön</a>
        
        <div class="nav-right">
            <a href="/account" class="nav-link">Hesabım</a>
        </div>
    </div>
</div>

<div class="content-wrapper">
    <h2>{{ poll.title }}</h2>
    <p class="poll-description">{{ poll.description }}</p>

    <form method="post" action="{% url 'anket:vote' poll.id %}">
        {% csrf_token %}

        {% for question in poll.question_set.all %}
            <div class="question-card">
                <span class="question-text">{{ question.text }}</span>

                {% for option in question.option_set.all %}
                    <label>
                        <input type="radio"
                               name="question_{{ question.id }}"
                               value="{{ option.id }}" required>
                        {{ option.text }}
                    </label>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="submit-btn">Oyu Gönder</button>
    </form>
</div>

</body>
</html>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: "Segoe UI", Arial;
    background: #ffffff;
    color: #111;
}
.upper_bar {
    height: 60px;
    border-bottom: 1px solid #eee;
    background: #fff;
    display: flex;
    align-items: center;
}
.nav-container {
    max-width: 1100px;
    margin: auto;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
}
.nav-container a {
    text-decoration: none;
    color: #d32f2f;
    font-weight: 600;
}
.content-wrapper {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
}
h2 {
    font-size: 28px;
    margin-bottom: 10px;
}
.poll-description {
    color: #666;
    margin-bottom: 30px;
}
.question-card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    background: #fff;
}
.question-text {
    display: block;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
}
label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #eee;
    cursor: pointer;
    transition: 0.2s;
}
label:hover {
    border-color: #d32f2f;
    background: #fff5f5;
}
label:has(input:checked) {
    border-color: #d32f2f;
    background: #fdecea;
    font-weight: 600;
}
input[type="radio"] {
    accent-color: #d32f2f;
    width: 16px;
    height: 16px;
}
.submit-btn {
    width: 100%;
    margin-top: 20px;
    height: 48px;
    border-radius: 8px;
    background: #d32f2f;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: 0.2s;
}
.submit-btn:hover {
    background: #b71c1c;
}
.submit-btn:active {
    transform: scale(0.98);
}
</style>
