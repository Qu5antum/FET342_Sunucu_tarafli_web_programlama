<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Anket Oluştur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --primary-light: #fdecea;
            --bg: #f8f9fa;
            --text-main: #202124;
            --border: #dadce0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }
        .navbar {
            height: 64px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1000px;
            margin: auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
        }
        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .container {
            max-width: 800px;
            margin: 32px auto;
            padding: 0 20px;
        }
        h2 {
            font-weight: 500;
            margin-bottom: 24px;
            color: #3c4043;
        }
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1);
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #5f6368;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            background: #fff;
        }
        .chip input { display: none; }
        .chip:has(input:checked) {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .chip:hover { border-color: var(--primary); }
        .btn {
            cursor: pointer;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            width: 100%;
            font-size: 16px;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline {
            border-color: var(--primary);
            color: var(--primary);
            background: transparent;
        }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-danger-sm {
            color: #d93025;
            background: transparent;
            padding: 4px 8px;
        }
        .btn-danger-sm:hover { background: #feeeee; }
        .question-card {
            border-left: 4px solid var(--primary);
            background: #fdfdfd;
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 4px;
            border-top: 1px solid #eee;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .option-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }
        .option-row input { margin-bottom: 0; }
        .add-option-link {
            color: var(--primary);
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
        }
        .add-option-link:hover { text-decoration: underline; }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s ease;
            font-size: 14px;
            user-select: none;
        }
        .chip input {
            display: none; 
        }
        .chip:has(input:checked) {
            background-color: #d32f2f;
            border-color: #d32f2f;
            color: #fff;
            box-shadow: 0 4px 6px rgba(211, 47, 47, 0.2);
        }
        .chip:hover:not(:has(input:checked)) {
            border-color: #d32f2f;
            color: #d32f2f;
            background: #fdecea;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .radio-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .radio-item:hover {
            background: #fcfcfc;
            border-color: #ddd;
        }
        .radio-item input[type="radio"] {
            accent-color: #d32f2f; 
            width: 18px;
            height: 18px;
            margin-top: 2px;
        }
        .radio-content {
            display: flex;
            flex-direction: column;
        }
        .radio-label {
            font-weight: 600;
            font-size: 14px;
            color: #111;
        }
        .radio-desc {
            font-size: 12px;
            color: #666;
        }
        .radio-item:has(input:checked) {
            border-color: #d32f2f;
            background-color: #fdecea;
        }

    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <a href="{% url 'anket:polls' %}" class="back-link">Geri Dön</a>
        <div class="nav-right">
            <a href="#" style="text-decoration:none; color:#555; font-size:14px;">Hesabım</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Anket Oluştur</h2>

    <form method="post" onsubmit="prepareData()">
        {% csrf_token %}
        <div class="card">
            <label>Anket Başlığı</label>
            <input type="text" name="title" placeholder="Örn: Müşteri Memnuniyeti" required>

            <label>Açıklama</label>
            <textarea name="description" rows="3" placeholder="Bu anket hakkında kısa bir bilgi yazın..."></textarea>
        </div>

        <div class="card">
            <label>Gruplar</label>
            <div class="chips">
                {% for group in groups %}
                    <label class="chip">
                        <input type="checkbox" name="groups" value="{{ group.id }}">
                        <span>{{ group.name }}</span>
                    </label>
                {% endfor %}
            </div>
        </div>

        <div class="card">
            <label>Görünürlük</label>
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="visibility" value="public">
                    <div class="radio-content">
                        <span class="radio-label">Herkese Açık (Public)</span>
                        <span class="radio-desc">Anket tüm kullanıcılar tarafından görülebilir.</span>
                    </div>
                </label>
                
                <label class="radio-item">
                    <input type="radio" name="visibility" value="private" checked>
                    <div class="radio-content">
                        <span class="radio-label">Gizli (Private)</span>
                        <span class="radio-desc">Sadece seçilen gruplar anketi görebilir.</span>
                    </div>
                </label>
            </div>
            <div style="margin-top:20px;">
                <label>Anket Son Tarihi</label>

                <input type="text"
                    id="expires_at"
                    name="expires_at"
                    placeholder="Select date and time">
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0; font-size:18px;">Sorular</h3>
                <button type="button" class="btn btn-outline" onclick="addQuestion()">+ Yeni Soru Ekle</button>
            </div>

            <div id="questions"></div>
        </div>

        <input type="hidden" name="questions" id="questionsInput">
        <button type="submit" class="btn btn-primary">Anketi Yayınla</button>
    </form>
</div>

<script>
    let questions = [];

    function addQuestion() {
        questions.push({ text: "", options: ["", ""] });
        render();
    }

    function removeQuestion(index) {
        questions.splice(index, 1);
        render();
    }

    function addOption(qIndex) {
        questions[qIndex].options.push("");
        render();
    }

    function removeOption(qIndex, oIndex) {
        if(questions[qIndex].options.length > 2) {
            questions[qIndex].options.splice(oIndex, 1);
            render();
        } else {
            alert("En az 2 seçenek olmalıdır.");
        }
    }

    function updateQuestionText(i, val) { questions[i].text = val; }
    function updateOption(q, o, val) { questions[q].options[o] = val; }

    function render() {
        const container = document.getElementById("questions");
        container.innerHTML = "";

        questions.forEach((q, qIndex) => {
            const div = document.createElement("div");
            div.className = "question-card";

            div.innerHTML = `
                <div class="q-header">
                    <span style="font-size:14px; color:#777;">SORU ${qIndex + 1}</span>
                    <button type="button" class="btn-danger-sm btn" onclick="removeQuestion(${qIndex})">Kaldır</button>
                </div>

                <input type="text" placeholder="Soru metnini buraya yazın..."
                    value="${q.text}"
                    oninput="updateQuestionText(${qIndex}, this.value)">

                <div class="options-list">
                    ${q.options.map((opt, oIndex) => `
                        <div class="option-row">
                            <span style="color:#ccc">•</span>
                            <input type="text" placeholder="Seçenek ${oIndex + 1}"
                                value="${opt}"
                                oninput="updateOption(${qIndex}, ${oIndex}, this.value)">
                            <button type="button" class="btn-danger-sm btn" onclick="removeOption(${qIndex}, ${oIndex})">✕</button>
                        </div>
                    `).join("")}
                </div>

                <button type="button" class="add-option-link"
                    onclick="addOption(${qIndex})">+ Seçenek Ekle</button>
            `;
            container.appendChild(div);
        });
    }

    function prepareData() {
        document.getElementById("questionsInput").value = JSON.stringify(questions);
    }
    if(questions.length === 0) addQuestion();
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    flatpickr("#expires_at", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        locale: "en",
        minDate: "today"
    });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
