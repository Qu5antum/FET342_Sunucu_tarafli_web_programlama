<div class="login-container">
    <div class="login-card">
        <h2>Giriş Yap</h2>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="field">
                <label>Email</label>
                {{ form.username }}
                {% if form.username.errors %}
                    <div class="error small">
                        {{ form.username.errors }}
                    </div>
                {% endif %}
            </div>

            <div class="field">
                <label>Password</label>
                {{ form.password }}
                {% if form.password.errors %}
                    <div class="error small">
                        {{ form.password.errors }}
                    </div>
                {% endif %}
            </div>

            <button type="submit">Giriş Yap</button>
        </form>
    </div>
</div>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
}
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.login-card {
    width: 100%;
    max-width: 380px;
    padding: 40px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #eee;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}
h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #111;
    font-weight: 600;
}
.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
label {
    font-size: 14px;
    color: #444;
}
input {
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    font-size: 14px;
    transition: 0.2s ease;
}
input:focus {
    border-color: #d32f2f;
    box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
    outline: none;
}
button {
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s ease;
}
button:hover {
    background: #b71c1c;
}
button:active {
    transform: scale(0.98);
}
.error {
    background: #fdecea;
    color: #b71c1c;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
}
.error.small {
    padding: 6px 8px;
    font-size: 12px;
}
</style>
